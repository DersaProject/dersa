<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Веб страница с фреймами и вкладками</title>
    <link rel="stylesheet" href="dist/themes/default/style.css" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #top-frame {
            height: 80px;
            border-bottom: 2px solid #ccc;
            flex-shrink: 0;
            background-color: #f5f5f5;
            padding: 10px;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #left-frame {
            width: 200px;
            min-width: 150px;
            max-width: 400px;
            border-right: 2px solid #ccc;
            overflow: auto; /* вертикальная и горизонтальная прокрутка */
            resize: horizontal;
            background-color: #e9ecef;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        #main-frame {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        /* Стили для вкладок */
        .tabs {
            display: flex;
            background: #f1f1f1;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            padding: 10px 15px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
        }

        .tab.active {
            background: white;
            border: 1px solid #ddd;
            border-bottom: 1px solid white;
        }

        .tab-content {
            display: none;
            padding: 0;
            flex: 1;
        }

        .tab-content.active {
            display: flex;
        }

        /* Блоки внутри первой вкладки */
        .split-panel {
            display: flex;
            height: calc(100vh - 130px);
            width: 100%;
        }

        .left-panel {
            flex: 1;
            width: 30%;
            min-width: 250px;
            border-right: 1px solid #ddd;
            padding: 15px;
            overflow-y: auto;
        }

        .right-panel {
            flex: 3;
            background-color: #fff;
            padding: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #f5f9ff;
            cursor: pointer;
        }

        .property-value {
            width: 100%;
            height: 100%;
            padding: 15px;
            box-sizing: border-box;
            background-color: #fafafa;
            border: none;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Верхний фрейм -->
        <div id="top-frame">
        </div>

        <!-- Основной контент -->
        <div class="main-content">
            <!-- Левый фрейм -->
            <div id="left-frame">
                <div id="dersa">
                    <!-- Здесь будет дерево узлов -->
                </div>
            </div>

            <!-- Основной фрейм с вкладками -->
            <div id="main-frame">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('tab1')">Вкладка 1</div>
                    <div class="tab" onclick="switchTab('tab2')">Вкладка 2</div>
                    <div class="tab" onclick="switchTab('tab3')">Вкладка 3</div>
                </div>

                <!-- Вкладка 1 -->
                <div class="tab-content active" id="tab1">
                    <div class="split-panel">
                        <!-- Левый блок: таблица свойств -->
                        <div class="left-panel">
                            <table id="properties-table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Value</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Данные будут заполняться через JavaScript -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Правый блок: значение свойства -->
                        <div class="right-panel">
                            <div id="property-value" class="property-value">
                                Выберите свойство из таблицы слева
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Вкладка 2 -->
                <div class="tab-content" id="tab2">
                    <div style="padding: 20px;">
                        <h2>Содержимое вкладки 2</h2>
                        <p>Здесь может быть любой резервный контент.</p>
                    </div>
                </div>

                <!-- Вкладка 3 -->
                <div class="tab-content" id="tab3">
                    <div style="padding: 20px;">
                        <h2>Содержимое вкладки 3</h2>
                        <p>Ещё один блок резервного контента.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Переключение вкладок
        function switchTab(tabId) {
            // Убираем активный класс у всех вкладок и контента
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));


            // Добавляем активный класс нужной вкладке и контенту
            const tabIndex = ['tab1', 'tab2', 'tab3'].indexOf(tabId);
            document.querySelector(`.tab:nth-child(${tabIndex + 1})`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Получение свойств узла с сервера
        async function GetNodeProperties(node_id) {
            try {
                const response = await fetch(`/Node/Properties/${node_id}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Ошибка загрузки свойств узла:', error);
                return [];
            }
        }

        // Получение детального значения свойства
        async function GetPropertyValue(node_id, property_name) {
            try {
                // Здесь может быть отдельный API-вызов
                return `Детальная информация для свойства "${property_name}" узла ${node_id}:

- Тип данных: строка
- Изменяемость: да
- Последнее обновление: ${new Date().toLocaleString()}
- Описание: это демонстрационное значение для тестирования интерфейса.`;
            } catch (error) {
                console.error('Ошибка получения значения свойства:', error);
                return `Не удалось получить значение для свойства "${property_name}" (узел ${node_id}). Проверьте подключение к серверу.`;
            }
        }

        // Загрузка свойств узла в таблицу
        async function loadNodeProperties(node_id) {
            const properties = await GetNodeProperties(node_id);
            const tableBody = document.querySelector('#properties-table tbody');
            tableBody.innerHTML = '';

            properties.forEach(property => {
                const row = document.createElement('tr');
                row.innerHTML = `
                        <td>${property.Name}</td>
                <td>${property.Value}</td>
                    `;

                // Обработчик клика на строку таблицы
                row.addEventListener('click', async () => {
                    // Сбрасываем подсветку всех строк
                    document.querySelectorAll('#properties-table tbody tr').forEach(r => {
                        r.style.backgroundColor = '';
                    });
                    // Подсвечиваем выбранную строку
                    row.style.backgroundColor = '#e3f2fd';

                    const propertyName = property.Name;
                    await displayPropertyValue(node_id, propertyName);
                });

                tableBody.appendChild(row);
            });
        }

        // Отображение детального значения свойства
        async function displayPropertyValue(node_id, property_name) {
            const value = await GetPropertyValue(node_id, property_name);
            document.getElementById('property-value').innerHTML = value;
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            // Очищаем таблицу свойств (оставляем только заголовки)
            const tableBody = document.querySelector('#properties-table tbody');
            tableBody.innerHTML = '';

            // Добавляем обработчики для навигации
            document.querySelectorAll('#left-frame a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                });
            });
        });

        // Демо‑данные для тестирования (если API недоступно)
        window.demoData = {
            1: [
                { Name: 'ID', Value: '1' },
                { Name: 'Тип', Value: 'Сервер' },
                { Name: 'Статус', Value: 'Активен' },
                { Name: 'Версия', Value: '1.2.3' },
                { Name: 'Местоположение', Value: 'ЦОД Москва' }
            ],
            2: [
                { Name: 'ID', Value: '2' },
                { Name: 'Тип', Value: 'База данных' },
                { Name: 'Статус', Value: 'Резервный' },
                { Name: 'Размер', Value: '5 ГБ' },
                { Name: 'Владелец', Value: 'Отдел аналитики' }
            ],
            3: [
                { Name: 'ID', Value: '3' },
                { Name: 'Тип', Value: 'Веб‑приложение' },
                { Name: 'Статус', Value: 'В разработке' },
                { Name: 'Язык', Value: 'JavaScript' },
                { Name: 'Версия Node.js', Value: '18.x' }
            ]
        };

        // Модифицированная версия GetNodeProperties для работы с демо‑данными
        async function GetNodeProperties(node_id) {
            try {
                // Попытка получить данные с сервера
                const response = await fetch(`/Node/Properties/${node_id}`);
                if (response.ok) {
                    return await response.json();
                }
            } catch (error) {
                console.warn('API недоступно, используем демо‑данные:', error);
            }

            // Возвращаем демо‑данные, если API недоступно
            return window.demoData[node_id] || [];
        }
    </script>
    <script src="dist/jquery.js"></script>
    <script src="dist/jquery-ui.js"></script>
    <script src="dist/jstree.js"></script>
    <script src="dist/dersatree.js"></script>

</body>
</html>
