  <script>
    // Тестовый массив данных
    const testData = [
{item:10159948,icon: 'fa fa-share',tooltip:"copy attrs"},
{item:10163494,icon: 'fa fa-info',tooltip:"information"},
{item:10150232, icon:"fa fa-arrows-v", tooltip:"add rel"},
{item:'P1_3',icon: 'fa fa-magic',tooltip:"magic"},
{item:10160042,icon: 'fa fa-pencil',tooltip:"редактировать"},
{item:10154438,icon: 'fa fa-clone',tooltip:"сравнить"},
{item:'P1_4',icon: 'fa fa-gears',tooltip:"настройки"},
{item:'P1_2',icon: 'fa fa-wrench',tooltip:"свойства"},
{item:10150261,icon: 'fa fa-key',tooltip:"diagram / table / html"},
{item:10150585,icon: 'fa fa-save',tooltip:"сохранить"},
{item:10150588,icon:"fa fa-id-card-o",tooltip:"password"}
    ];


    // Вставляем сюда код функции addToolButtons и OnToolButtonClick
function addToolButtons(itemsArray) {
  const toolBox = document.getElementById('tool_box');

  if (!toolBox) {
    console.error('Элемент с ID "tool_box" не найден на странице');
    return;
  }

  const fragment = document.createDocumentFragment();

  itemsArray.forEach(itemObj => {
    const itemValue = itemObj.item;    // число, передаётся без кавычек
    const iconValue = itemObj.icon;   // строка с классами иконки
    const tooltipValue = itemObj.tooltip; // текст подсказки

    // Создаём кнопку
    const button = document.createElement('button');
    button.className = 'btn';

    // Обработчики событий без jQuery
    button.onmouseover = function() {
      const toolhint = document.getElementById('toolhint');
      toolhint.innerHTML = tooltipValue;
      toolhint.style.display = 'block';
    };

    button.onmouseout = function() {
      const toolhint = document.getElementById('toolhint');
      toolhint.style.display = 'none';
    };

    button.onclick = function() {
      OnToolButtonClick(itemValue); // число передаётся без кавычек
    };

    // Создаём иконку внутри кнопки
    const icon = document.createElement('i');
    icon.className = iconValue;
    button.appendChild(icon);

    fragment.appendChild(button);
  });

  // Очищаем блок и добавляем новые кнопки
  toolBox.innerHTML = '';
  toolBox.appendChild(fragment);
}

function OnToolButtonClick(item) {
  if(item === 10150585){
    dTree.saveAllNodes();
    return;
  }
	console.log('нажали кнопку для скрипта ' + item);
  const dTreeNode = dTree.getNode(item);
  if(dTreeNode && dTreeNode.stereotype === 'Script'){
    let obj = new Stereotypes[dTreeNode.stereotype](dTreeNode);
    obj.Exec();
  }
}
			
addToolButtons(testData);


  </script>
